<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>AI South African Recipe Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI South African Recipe Generator</h1>
      </header>

      <main>
        <form id="recipe-generator-form">
          <input
            type="text"
            placeholder="Enter a topic for a South African Recipe"
            autofocus
            required
            autocomplete="off"
            class="instructions"
            id="user-instructions"
          />
          <input type="Submit" class="submit-button" />
        </form>
        <div class="recipe" id="recipe"></div>
      </main>

      <footer>
        This AI project was coded by
        <a href="https://github.com/ruthlee2376-dot" target="_blank"
          >Ruth Lee</a
        >
        and is
        <a
          href="https://github.com/ruthlee2376-dot/South-African-Recipes-Generator"
          target="_blank"
        >
          open-sourced on GitHub</a
        >
        and is
        <a
          href="https://ai-south-african-recipes-generator.vercel.app/"
          target="_blank"
        >
          hosted on Vercel.</a
        >
      </footer>
    </div>

    <script src="src/index.js"></script>
  </body>
</html>
